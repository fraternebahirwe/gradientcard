<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta  charset="UTF-8">
        <link rel="icon" href="frate.png" type="image/x-icon">
        <title>Gradient card</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="gradient.css" rel="stylesheet">
     </head>
    <body>
        <div class="card">
            <!-- Section Gauche -->
            <section class="result">
                <p>Your Result</p>
                <div class="circle"><b>76</b>of 100</div>
                <h2>Great</h2>
                <p>You scored higher than 65% of the people who have taken these tests.</p>
            </section>

            <!-- Section Droite -->
            <section class="summary">
                <h3>Summary</h3>
                <div class="item red"><span>Reaction</span> <b>80 / 100</b></div>
                <div class="item yellow"><span>Memory</span> <b>92 / 100</b></div>
                <div class="item green"><span>Verbal</span> <b>61 / 100</b></div>
                <div class="item blue"><span>Visual</span> <b>73 / 100</b></div>
                <button>Continue</button>
            </section>
        </div>
    </body>
</html>
