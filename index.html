<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Card - Results Summary</title>
    <link rel="icon" href="frate.png" type="image/x-icon">
    <link rel="stylesheet" href="gradient.css">
</head>
<body>

    <main class="card">
        <!-- Section Gauche : Résultat Global -->
        <section class="result-panel">
            <h2 class="section-title">Your Result</h2>
            
            <div class="score-circle">
                <span class="score-number">76</span>
                <span class="score-max">of 100</span>
            </div>
            
            <p class="score-status">Great</p>
            <p class="score-description">
                You scored higher than 65% of the people who have taken these tests.
            </p>
        </section>

        <!-- Section Droite : Détail par catégorie -->
        <section class="summary-panel">
            <h2 class="section-title">Summary</h2>
            
            <ul class="summary-list">
                <!-- Réaction -->
                <li class="summary-item category-reaction">
                    <div class="category-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20"><path stroke="#F55" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M10.833 8.333V2.5l-6.666 9.167h5V17.5l6.666-9.167h-5Z"/></svg>
                        <span>Reaction</span>
                    </div>
                    <div class="category-score">
                        <span class="score-actual">80</span> <span class="score-divider">/ 100</span>
                    </div>
                </li>

                <!-- Mémoire -->
                <li class="summary-item category-memory">
                    <div class="category-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20"><path stroke="#FFB21E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M18.333 6.25a2.5 2.5 0 0 1-2.5 2.5 2.5 2.5 0 0 1-2.5-2.5 2.5 2.5 0 0 1 2.5-2.5 2.5 2.5 0 0 1 2.5 2.5Z"/><path stroke="#FFB21E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M1.667 13.75a2.5 2.5 0 0 1 2.5-2.5 2.5 2.5 0 0 1 2.5 2.5 2.5 2.5 0 0 1-2.5 2.5 2.5 2.5 0 0 1-2.5-2.5Z"/><path stroke="#FFB21E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M11.667 10a2.5 2.5 0 0 1-2.5 2.5 2.5 2.5 0 0 1-2.5-2.5 2.5 2.5 0 0 1 2.5-2.5 2.5 2.5 0 0 1 2.5 2.5Z"/><path stroke="#FFB21E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M15.833 8.75a6.667 6.667 0 0 1-6.666 3.75 6.667 6.667 0 0 1-5-3.75"/></svg>
                        <span>Memory</span>
                    </div>
                    <div class="category-score">
                        <span class="score-actual">92</span> <span class="score-divider">/ 100</span>
                    </div>
                </li>

                <!-- Verbal -->
                <li class="summary-item category-verbal">
                    <div class="category-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20"><path stroke="#00BB8F" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M7.5 10h5M7.5 7.5h2.5M16.667 10c0 3.68-3 6.667-6.667 6.667a6.69 6.69 0 0 1-3.142-.783L3.333 16.667l.784-3.525A6.657 6.657 0 0 1 3.333 10C3.333 6.32 6.32 3.333 10 3.333c3.68 0 6.667 3 6.667 6.667Z"/></svg>
                        <span>Verbal</span>
                    </div>
                    <div class="category-score">
                        <span class="score-actual">61</span> <span class="score-divider">/ 100</span>
                    </div>
                </li>

                <!-- Visuel -->
                <li class="summary-item category-visual">
                    <div class="category-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20"><path stroke="#1125D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M10 4.167c-4.167 0-7.5 2.5-9.167 5.833 1.667 3.333 5 5.833 9.167 5.833s7.5-2.5 9.167-5.833C18.333 6.667 15 4.167 10 4.167Z"/><path stroke="#1125D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg>
                        <span>Visual</span>
                    </div>
                    <div class="category-score">
                        <span class="score-actual">73</span> <span class="score-divider">/ 100</span>
                    </div>
                </li>
            </ul>

            <button type="button" class="btn-continue">Continue</button>
        </section>
    </main>

</body>
</html>
